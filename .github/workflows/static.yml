To get this working, we need to determine if your project uses Vite or Create React App (CRA). Since the previous attempt failed to find the /build folder, it is highly likely you are using Vite, which outputs to a folder named /dist.

Here is the full, corrected YAML. I have commented on the specific line you might need to flip depending on your project type.

Full deploy.yml
YAML

name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
  
        working-directory: personal-cv-react
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

          cache-dependency-path: personal-cv-react/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:

          path: personal-cv-react/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
